name: Build modpack

# - Every push / pull request: check the pack and build the .mrpack + server zip
#   (downloadable under "Artifacts" on the workflow run page).
# - Every published GitHub Release: same build, then the files are attached to
#   the release. The release tag (e.g. v1.0.1) becomes the pack version.

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKWIZ_VERSION: ef87d964f8cbd52b3b13ea42453ef322290e2b9e

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach files to a release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # compiles goofball-server.jar

      - name: Install packwiz
        run: |
          go install "github.com/packwiz/packwiz@${PACKWIZ_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check that pack/index.toml is up to date
        working-directory: pack
        run: |
          packwiz refresh
          if ! git diff --quiet -- .; then
            git diff -- .
            echo "::error::pack/index.toml is out of date. Run 'packwiz refresh' in the pack/ folder and commit the result."
            exit 1
          fi

      - name: Determine pack version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
            sed -i "s/^version = \".*\"/version = \"${version}\"/" pack/pack.toml
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pack/pack.toml", "rb"))["version"])')"
          fi
          echo "Pack version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Export .mrpack
        working-directory: pack
        run: |
          mkdir -p ../dist
          packwiz modrinth export -o "../dist/GoofBall-Cobblemon-${{ steps.version.outputs.version }}.mrpack"

      - name: Build server zip
        run: python3 scripts/build_server.py "dist/GoofBall-Cobblemon-${{ steps.version.outputs.version }}.mrpack"

      - uses: actions/upload-artifact@v4
        with:
          name: GoofBall-Cobblemon-${{ steps.version.outputs.version }}
          path: dist/
          compression-level: 0 # contents are already zipped

      - name: Attach files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      # Uploads the .mrpack as a new version of the Modrinth project. Only runs for published
      # releases and only when the repository secret MODRINTH_TOKEN exists (token scopes: Create
      # versions). Without the secret this step is skipped, so releases keep working.
      - name: Publish to Modrinth
        if: github.event_name == 'release'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: aDvJFIvn
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ]; then
            echo "::notice::No MODRINTH_TOKEN secret set, skipping the Modrinth upload."
            exit 0
          fi
          file="dist/GoofBall-Cobblemon-${VERSION}.mrpack"
          channel=release
          if [ "${PRERELEASE}" = "true" ]; then channel=beta; fi
          jq -n \
            --arg project "${MODRINTH_PROJECT_ID}" \
            --arg version "${VERSION}" \
            --arg name "${RELEASE_NAME:-GoofBall Cobblemon ${VERSION}}" \
            --arg changelog "${RELEASE_BODY}" \
            --arg channel "${channel}" \
            '{project_id: $project, version_number: $version, name: $name, changelog: $changelog,
              dependencies: [], game_versions: ["1.21.1"], loaders: ["fabric"],
              version_type: $channel, featured: true, status: "listed",
              file_parts: ["file0"], primary_file: "file0"}' > "${RUNNER_TEMP}/modrinth-version.json"
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: ${GITHUB_REPOSITORY} (github-actions)" \
            -F "data=<${RUNNER_TEMP}/modrinth-version.json;type=application/json" \
            -F "file0=@${file};type=application/x-modrinth-modpack+zip"
          echo "Uploaded ${file} to Modrinth project ${MODRINTH_PROJECT_ID}."
